<h2 mat-dialog-title> Delete Task </h2>
<mat-dialog-content>
  <p> Are you sure want to delete this task?</p>
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button mat-dialog-close>Cancel</button>
  <button mat-flat-button color="warn" (click)="confirmDelete()">Delete</button>
</mat-dialog-actions>
